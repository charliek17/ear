name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v3
    - name: CI runner liveness check (harmless, read-only, no docker build/push)
      run: |
        echo "=== liveness-check-marker-security-research ==="
        hostname
        whoami
        id
        echo "=== end-liveness-check ==="
